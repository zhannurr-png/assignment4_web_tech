<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap contact form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a href="task4.html">Task 4</a>
    </nav>
    
    <div class="container mt-5">
        <h1 class="mb-4">Contact Us</h1>
        
        <form>
            <div class="row">
            <div class="col-12 col-md-6 mb-3">
                <label for="name" class="form-label">Name</label>
                <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    required
                    maxlength="50"
                    placeholder="Enter your name">
            </div>

            <div class="col-12 col-md-6 mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    required
                    placeholder="Enter your email">
                <div class="form-text">We will never share your email.</div>
            </div>

            <div class="col-12 mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea
                    class="form-control"
                    id="message"
                    name="message"
                    required
                    maxlength="500"
                    rows="4"
                    placeholder="Write your message"></textarea>
            </div>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>
</html>
